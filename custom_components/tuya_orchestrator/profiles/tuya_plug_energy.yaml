# Matches: "Regleta, Habitación De Invitados" (category "cz" with energy
# monitoring). Tuya's cloud schema reports scale as decimal PLACES
# (actual = raw / 10^scale); this profile's `scale` field is instead a
# direct DIVISOR, already converted (10^places) - keep that conversion in
# mind when reading a new device's cloud schema for your own profiles.
name: Tuya smart plug (with energy monitoring)
product_ids:
  - 0fHWRe8ULjtmnBNd
dps:
  - id: 1
    platform: switch
    name: Power
    icon: mdi:power-plug
  - id: 9
    platform: number
    name: Countdown
    unit: s
    min: 0
    max: 86400
    step: 1
  - id: 17
    platform: sensor
    name: Energy
    device_class: energy
    unit: kWh
    scale: 1000  # Tuya scale=3 (decimal places) -> divisor 10^3
  - id: 18
    platform: sensor
    name: Current
    device_class: current
    unit: mA
    # Tuya scale=0 -> divisor 1, raw already in mA
  - id: 19
    platform: sensor
    name: Power
    device_class: power
    unit: W
    scale: 10  # Tuya scale=1 -> divisor 10
  - id: 20
    platform: sensor
    name: Voltage
    device_class: voltage
    unit: V
    scale: 10  # Tuya scale=1 -> divisor 10
