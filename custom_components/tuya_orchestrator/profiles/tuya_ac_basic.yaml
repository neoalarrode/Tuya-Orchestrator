# Matches: "AirClima dormitorio" / "AirClima 12000 Multi Indoor Connected 2"
# (category "kt" - portable/split AC unit).
#
# Grouped into a real `climate.*` entity (thermostat card: mode/setpoint/
# current temp/fan speed/sleep preset/swing/humidity all in one) instead of
# separate switch + number + select + sensor entities for the same DPs.
#
# RESOLVED CAVEAT: the raw cloud schema declares temp_set's max as 880
# (-> 88.0 C after the scale divisor), implausible for a real AC setpoint.
# Re-checked via the v2.0 Thing Data Model endpoint: that SAME response's
# own human-readable `description` field says "摄氏：16~31" (Celsius:
# 16-31) - a live reading (raw temp_set=215 -> 21.5C after scale) sits well
# inside that range, nowhere near 88C. Conclusion: `max:880` is a genuine
# metadata error in Tuya's own cloud schema (very likely copy-pasted from
# the parallel Fahrenheit DP's max=88), not a real device limit - using 31
# here instead, and saying so.
#
# `boolCode` (dp 123) is NOT a plain boolean despite the name - it's a
# hex-encoded 2-BYTE BITFIELD packing several unrelated toggles into one
# string DP (confirmed from Tuya's own field description). Exposed here as
# two individual `bit:`-mapped switches (display light, buzzer); the rest
# of that bitfield (eco, anti-mold dehumidify, evaporator self-clean,
# health mode, light sensor, dry mode, 8C heating, filter detection,
# soft wind...) is left unmapped - add more `bit:` entries the same way if
# wanted, see DPMapping.decode_bit()/encode_bit() for how it works.
#
# Air quality, dirty filter, energy counters, and the second swing axis
# (left_right_sweep) aren't mapped here either - auto-detection picks all
# of this up automatically at pairing time now (see auto_profile.py), this
# hand-written profile only covers the commonly-used subset as a
# reference/fallback for manual/offline setup.
name: Tuya portable/split AC
product_ids:
  - 4epook7bjtjzcxjb
dps:
  - id: 123
    platform: switch
    name: Display light
    icon: mdi:television-ambient-light
    bit: 3   # byte 0, bit 3 - "灯光" per Tuya's field description
  - id: 123
    platform: switch
    name: Buzzer
    icon: mdi:volume-high
    bit: 4   # byte 0, bit 4 - "蜂鸣" per Tuya's field description
climates:
  - name: AC
    icon: mdi:air-conditioner
    switch_dp: 1
    current_temp_dp: 3
    target_temp_dp: 2
    target_temp_scale: 10  # Tuya scale=1 -> divisor 10
    target_temp_min: 16
    target_temp_max: 31   # corrected from the schema's erroneous max:880 - see note above
    target_temp_step: 0.5
    mode_dp: 4
    mode_map:
      cold: cool
      hot: heat
      wet: dry
      wind: fan_only
      auto: heat_cool
    fan_dp: 5
    fan_map:
      strong: Strong
      high: High
      mid_high: Medium-high
      mid: Medium
      mid_low: Medium-low
      low: Low
      mute: Mute
      auto: Auto
    preset_dp: 105
    preset_map:
      'off': 'Off'
      normal: Normal
      old: Elderly
      child: Child
    swing_dp: 113
    swing_map:
      '0': 'Off'
      '1': Up-down
      '2': Up only
      '3': Down only
    humidity_dp: 18
